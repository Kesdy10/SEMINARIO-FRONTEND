name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar lint
        run: npm run lint

      - name: Construir la app de Next.js
        run: npm run build

      - name: Revisar tipos de TypeScript
        run: npx tsc --noEmit

      - name: Construir la imagen de Docker de produccion
        run: docker build -t seminario-frontend-prod .